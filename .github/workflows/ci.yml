name: CI/CD Pipeline - Motor Claim Adjudication Assistant

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Code Formatting (Black)
      run: |
        black --check .

    - name: Static Code Analysis (Pylint & Flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        pylint src/core src/agents src/db src/utils src/strategies --fail-under=8.0

    - name: Run Automated Pytest Suite
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        PYTHONPATH: .
      run: |
        pytest tests/ -v

    - name: Execute Evaluation Benchmark Suite
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        PYTHONPATH: .
      run: |
        python src/eval/run_eval.py --dataset src/eval/eval_dataset.json
